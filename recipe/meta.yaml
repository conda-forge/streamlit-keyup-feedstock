{% set name = "streamlit-keyup" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 193c7fcd204695375024612e0506f3398421a1bc298830e45275e310352d8709

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - streamlit >=1.2
    - jinja2

test:
  imports:
    - st_keyup
  commands:
    - export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/blackary/streamlit-keyup
  summary: Streamlit text input that returns value on keyup
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
