schema_version: 1

context:
  name: streamlit-keyup
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 193c7fcd204695375024612e0506f3398421a1bc298830e45275e310352d8709

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - streamlit >=1.2
    - jinja2

tests:
  - python:
      imports:
        - st_keyup
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - export PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python

about:
  summary: Streamlit text input that returns value on keyup
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/blackary/streamlit-keyup

extra:
  recipe-maintainers:
    - thewchan
